version: 1
tasks:
  - id: task-8981
    title: "Каркас Telegram-бота: меню, роли, проверка доступа"
    description: "Создать основу Telegram-бота: обработку /start, главное меню с
      разделами, проверку доступа и определение роли пользователя. Владелец
      (Telegram ID 5177702263) видит админ-разделы; добавленные участники —
      разделы участника; незнакомые пользователи получают сообщение, что доступа
      нет. Токен бота берётся из переменной окружения TELEGRAM_BOT_TOKEN. Данные
      пользователей (Telegram ID, тег, роль, срок доступа) хранятся в DynamoDB.
      Направление работы: реализовать меню, inline-кнопки и маршрутизацию так,
      чтобы пользователь сразу мог зайти в бота и видеть доступные ему разделы."
    status: completed
    acceptance_criteria:
      - Владелец (Telegram ID 5177702263) отправляет /start и получает главное
        меню бота
      - Пользователь без доступа получает сообщение об отсутствии доступа и не
        видит разделы
      - Меню отображает разделы с учётом роли владельца/админа/участника
      - Данные пользователей и ролей сохраняются в DynamoDB, а не в памяти
      - Бот запускается с токеном из переменной окружения TELEGRAM_BOT_TOKEN
    summary: "Реализован каркас Telegram-бота: webhook-роут
      app/api/telegram/webhook/route.ts с zod-валидацией, обработка /start и
      inline-кнопок в lib/telegram/handler.ts, роли и проверка доступа (владелец
      по ID 5177702263, админ/трейдер/участник, срок доступа) в
      lib/telegram/access.ts, меню по ролям в lib/telegram/menu.ts. Пользователи
      хранятся в DynamoDB (таблица bot_users, модель в lib/models.ts). Токен
      берётся из TELEGRAM_BOT_TOKEN; для установки webhook добавлен скрипт
      scripts/telegram-webhook.ts (npm run bot:webhook). Миграция выполнена,
      typecheck/lint/build проходят."
  - id: task-8942
    title: "Управление доступом: подписки вручную"
    description:
      "Реализовать админ-функции в боте: добавление участника по Telegram
      ID с заданием тега и срока доступа в днях; назначение и снятие админов
      (только владелец); назначение трейдеров-сигнальщиков среди добавленных
      пользователей (владелец и админы). Бот уведомляет пользователя при
      добавлении. По истечении срока доступа бот перестаёт выполнять команды
      пользователя и сообщает об истечении подписки. Данные хранятся в
      DynamoDB."
    status: completed
    acceptance_criteria:
      - Владелец добавляет пользователя по Telegram ID с тегом и сроком доступа
        в днях — пользователь получает доступ
      - Владелец назначает и снимает админов; админы добавляют пользователей, но
        не могут назначать трейдеров
      - Владелец и админы назначают трейдеров-сигнальщиков среди добавленных
        пользователей
      - После истечения срока доступа бот перестаёт выполнять команды и
        уведомляет пользователя об истечении подписки
      - Владелец видит список пользователей с тегами, ролями и оставшимся сроком
        доступа
    summary:
      "Реализованы команды управления доступом в боте: /add (Telegram ID +
      срок в днях + тег, уведомление добавленного), /admin, /unadmin (только
      владелец), /trader, /untrader (владелец и админы, только среди
      добавленных), /users (владелец: теги, роли, оставшиеся дни) — парсинг и
      zod-валидация в lib/telegram/commands.ts, выполнение в
      lib/telegram/admin.ts, текстовые команды маршрутизируются в
      lib/telegram/handler.ts, дата-хелперы в lib/telegram/access.ts. Истечение
      доступа блокирует команды и меню с уведомлением о подписке. Данные —
      DynamoDB (bot_users, добавлены tag и listBotUsers в lib/models.ts).
      Typecheck/lint/build проходят."
  - id: task-3993
    title: "Мои счета: привязка API UpScale"
    description: "Реализовать раздел участника «Мои счета»: привязка API-ключа
      UpScale основного счета (источник сделок) и дополнительных счетов для
      копирования. Бот проверяет ключ запросом GET /accounts/with-risk-status на
      api.upscale.trade и показывает найденные счета: баланс, эквити, фазу,
      статус API-торговли (apiTrading). Счета без включённой API-торговли
      помечаются как негодные для копирования. Ключи хранятся защищённо и в чате
      показываются только маскированными. Участник видит список счетов с
      пометкой основной/дополнительный и может удалить привязку. Все числа
      UpScale — строки fp9 (×10⁹), читать через BigInt/Decimal. Данные хранятся
      в DynamoDB."
    status: completed
    acceptance_criteria:
      - Участник добавляет основной счет по API-ключу UpScale и видит его в
        списке как источник сделок
      - Участник добавляет дополнительные счета и видит их в списке как счета
        для копирования
      - По ключу отображаются счета UpScale с балансом, эквити, фазой и статусом
        API-торговли; счет с выключенной API-торговлей помечается как негодный
        для копирования
      - API-ключи отображаются в чате только в маскированном виде
      - Участник может удалить привязанный счет, после чего бот перестаёт
        работать с ним
      - Ошибки неверного ключа показываются понятным сообщением
    summary: "Реализован раздел «Мои счета» бота: экран со списком привязок
      (основной — источник сделок, дополнительные — для копирования) в
      lib/telegram/accounts.ts, диалог привязки по API-ключу (zod-валидация
      usk_…, проверка через GET /accounts/with-risk-status) и удаление с
      подтверждением. Клиент UpScale и fp9-форматирование (BigInt) — в
      lib/upscale/client.ts и lib/upscale/fp9.ts; ключи шифруются AES-256-GCM
      (lib/telegram/crypto.ts) и в чате показываются только маскированными.
      Данные — DynamoDB (bot_upscale_bindings, bot_states; схема в
      lib/schema.ts, модели в lib/models.ts), миграция выполнена. Неверный
      ключ/ошибки API показываются понятными сообщениями. Typecheck/lint/build
      проходят."
  - id: task-8353
    title: "Активные трейдеры: список и карточка со статистикой"
    description: "Реализовать раздел «Активные трейдеры»: список
      трейдеров-сигнальщиков сервиса. При нажатии на трейдера открывается
      карточка: ник (тег), количество сделок, топ-актив, винрейт, средний RR
      (riskRewardRatio), среднее время удержания (avgPositionHoldTime), сколько
      человек его копирует. Статистика берётся запросом GET
      /accounts/{accountId}/stats по основному счету трейдера; пустая статистика
      показывается как «сделок ещё нет». Числа fp9 конвертируются в читаемый
      вид. Данные хранятся в DynamoDB."
    status: completed
    acceptance_criteria:
      - Раздел показывает список активных трейдеров сервиса
      - Карточка трейдера показывает ник, число сделок, активы, винрейт, средний
        RR, среднее время удержания и число копирующих
      - Статистика берётся из GET /accounts/{accountId}/stats основного счета
        трейдера
      - Статистика обновляется после закрытия каждой сделки трейдера
      - Трейдер без статистики отображается с пометкой, что сделок ещё нет
    summary: "Реализован раздел «Активные трейдеры» бота: список
      трейдеров-сигнальщиков с числом сделок и карточка (ник, сделки, топ-актив,
      винрейт, средний RR, среднее время удержания, число копирующих) в
      lib/telegram/traders.ts; роутинг в lib/telegram/handler.ts и menu.ts.
      Статистика берется запросом GET /accounts/{accountId}/stats по основному
      счету трейдера (fetchAccountStats в lib/upscale/client.ts), fp9-числа
      конвертируются через BigInt (formatPercentFp9, formatHoldTimeFp9 в
      lib/upscale/fp9.ts). Снимки статистики хранятся в DynamoDB (таблица
      bot_trader_stats, схема в lib/schema.ts, модели в lib/models.ts), при
      открытии карточки снимок автообновляется, есть кнопки обновления. Пустая
      статистика показывается как «сделок ещё нет». Миграция выполнена,
      typecheck/lint/build проходят."
  - id: task-1373
    title: Подписка на трейдера и коэффициент копирования
    description: "Реализовать подписку на трейдера из его карточки: участник
      выбирает соотношение копирования 2:1, 1:1, 0,5:1 или вводит произвольное.
      Подписка требует привязанных счетов: основной счет подписчика не
