      (после отписки копирование прекращается). Данные хранятся в DynamoDB."
    status: completed
    acceptance_criteria:
      - Участник подписывается на трейдера и выбирает коэффициент (2:1, 1:1,
        0,5:1 или своё значение)
      - Участник видит список своих активных подписок с коэффициентами
      - Участник может изменить коэффициент и отписаться
      - После отписки копирование по подписке прекращается
    summary: "Реализованы подписки на трейдеров: из карточки трейдера
      (lib/telegram/traders.ts) кнопка «Подписаться», выбор коэффициента 2:1,
      1:1, 0,5:1 или ввод произвольного (zod-валидация в
      lib/validation/subscriptions.ts), раздел «Мои подписки» со списком
      активных подписок, сменой коэффициента и отпиской с подтверждением — в
      lib/telegram/subscriptions.ts; роутинг и ввод произвольного коэффициента
      через bot_states в lib/telegram/handler.ts и menu.ts. Подписка проверяет
      привязку основного и дополнительного счетов (основной не копируется, копии
      на дополнительных, требование включённой API-торговли); после отписки
      подписка удаляется и копирование прекращается. В карточке трейдера
      показывается реальное число копирующих. Данные — DynamoDB (таблица
      bot_subscriptions с GSI trader-index, схема в lib/schema.ts, модели в
      lib/models.ts), миграция выполнена. Typecheck/lint/build проходят."
  - id: task-5018
    title: Движок копирования сделок
    description:
      'Реализовать цикл автокопирования: бот периодически опрашивает GET
      /positions/{accountId}/active по основному счету каждого трейдера и
      сопоставляет позиции с сохранённым состоянием. Новая позиция трейдера →
      расчёт объёма копии для каждого подписчика (объём позиции трейдера ×
      размер счета подписчика / размер счета трейдера × коэффициент подписки) и
      открытие market-ордера POST /orders на дополнительных счетах подписчика с
      заголовком x-idempotency-key; id копии фиксируется чтением GET
      /positions/{accountId}/active, так как ответ ордера не содержит id
      позиции. Стоп-лосс и тейк-профит передаются в ордере как
      stopTriggerPrice/takeTriggerPrice пропорционально ценовым уровням исходной
      позиции. Увеличение позиции трейдера (рост size/version) → увеличение
      копии. Закрытие позиции трейдера → закрытие копий ордером take с
      triggerPrice "0" и amount = размер копии в базовом активе. Подписчикам
      отправляются уведомления об открытии/закрытии копии. Состояние
      позиций-копий и трейдера хранится в DynamoDB. Все вычисления объёмов — в
      Decimal/BigInt над строками fp9 без плавающей точки. Запросы к UpScale
      ограничиваются лимитами ключа (10/сек, 60/мин отдельно на чтение и
      запись), при 429 бот уважает Retry-After; ошибки API ветвятся по машинному
      коду (error) и превращаются в понятные сообщения пользователю.'
    status: completed
    acceptance_criteria:
      - После открытия позиции у трейдера бот открывает копии на всех
        дополнительных счетах его подписчиков
      - Объём копии равен объёму позиции трейдера × (счет подписчика / счет
        трейдера) × коэффициент подписки
      - Стоп-лосс и тейк-профит копируются пропорционально ценовым уровням
        позиции трейдера
      - Увеличение позиции трейдера отражается увеличением копий; копия
        закрывается, когда трейдер закрывает исходную позицию
      - Подписчики получают уведомление об открытой и закрытой копии позиции
      - Записи ордеров идут с заголовком x-idempotency-key; повторный опрос не
        создаёт дубликаты копий
      - Бот соблюдает лимиты UpScale (10/сек, 60/мин на чтение и запись),
        уважает Retry-After при 429 и показывает понятные сообщения по кодам
        ошибок API
    summary:
      'Движок копирования: runCopyEngineCycle в lib/copy/engine.ts опрашивает
      позиции трейдеров, открывает копии market-ордерами с x-idempotency-key
      (copyId детерминирован — без дубликатов), фиксирует id копии чтением
      позиций, увеличивает при росте size/version и закрывает take-ордером с
      triggerPrice "0"; стоп/тейк копируются, уведомления —
      lib/telegram/notify.ts. Объёмы — BigInt над fp9 (lib/copy/volume.ts);
      состояние — DynamoDB, миграция выполнена. Лимиты, Retry-After и коды
      ошибок — lib/upscale/client.ts и rate-limit.ts. Запуск:
      instrumentation.ts, /api/cron/copy-engine, npm run bot:copy-cycle.'
  - id: task-5758
    title: Лимит дневной просадки
    description: "Реализовать лимит дневной просадки: участник задаёт процент от
      счета, который готов потерять за день. Бот периодически читает GET
      /accounts/risk-status (снимки по всем счетам ключа) и сравнивает текущее
      эквити с dayStartEquity; когда убыток достигает лимита, бот перестаёт
      открывать новые копии на этом счете до конца дня и уведомляет участника.
      При срабатывании лимита по желанию участника открытые копии закрываются
      через POST /positions/{accountId}/close-all. Лимит можно изменить в любой
      момент; на следующий день копирование возобновляется. Состояние
      срабатывания лимита хранится в DynamoDB с привязкой к торговому дню."
    status: completed
    acceptance_criteria:
      - Участник задаёт дневной лимит просадки в процентах
      - При достижении лимита бот не открывает новые позиции до конца дня и
        уведомляет участника
      - На следующий день лимит сбрасывается и копирование возобновляется
      - Участник может изменить лимит в любой момент
      - Расчёт просадки ведётся по dayStartEquity из статус-эндпоинтов риска
        UpScale без плавающей точки
    summary:
      "Реализован лимит дневной просадки: раздел «🛡 Лимит просадки» (пресеты
      1–5%, произвольный ввод, смена/снятие лимита, тумблер автозакрытия
      close-all) в lib/telegram/drawdown.ts и menu.ts; проверка циклом в
      lib/copy/drawdown.ts — GET /accounts/risk-status (снимки по ключу,
      fetchRiskStatuses в lib/upscale/client.ts), сравнение эквити с
      dayStartEquity чистым BigInt-расчётом, при достижении лимита фиксация
      срабатывания в DynamoDB (bot_drawdown_states, привязка к торговому дню
      UTC, таблицы в lib/schema.ts), уведомление участника и опциональное
      закрытие позиций POST /positions/{accountId}/close-all. Движок копирования
      пропускает счета с сработавшим лимитом (lib/copy/engine.ts); на следующий
      день состояние сбрасывается и копирование возобновляется. Миграция
      выполнена, typecheck/lint/build проходят."
  - id: task-3278
    title: Статистика сделок и история участника
    description: "Реализовать учёт сделок: после закрытия каждой скопированной
      позиции (успешной или убыточной) бот фиксирует сделку — актив,
      направление, результат (PnL), время удержания — и обновляет агрегаты
      карточки трейдера (число сделок, винрейт, RR, время удержания). Участник
      видит историю своих скопированных сделок с результатом в отдельном
      разделе. Сделки хранятся в DynamoDB."
    status: completed
    acceptance_criteria:
      - После закрытия сделки она появляется в карточке трейдера с результатом и
        активом
      - Участник видит историю своих скопированных сделок с результатом
      - Статистика учитывает и прибыльные, и убыточные сделки
    summary: "Реализован учёт закрытых скопированных сделок: при закрытии копии
      движок (lib/copy/engine.ts) вызывает recordClosedCopyTrade в lib/trades.ts
      — сделка с активом, направлением, PnL (из истории портфеля UpScale,
      fetchClosedPositionPnlFp9), RR и временем удержания пишется в DynamoDB
      (новая таблица bot_trades, GSI по подписчику/трейдеру, схема в
      lib/schema.ts, модели в lib/models.ts), агрегаты карточки трейдера
      пересчитываются в bot_trader_stats и показываются в карточке
      (lib/telegram/traders.ts) вместе с последними сделками и их результатом;
      PnL также добавлен в уведомление о закрытии. Раздел «📊 Моя статистика»
      (lib/telegram/my-stats.ts, роутинг в handler.ts и menu.ts) показывает
      участнику итоги (прибыльные/убыточные, суммарный PnL, винрейт) и историю
      своих сделок с результатом. Учитываются и прибыльные, и убыточные сделки.
      Миграция выполнена, typecheck/lint/build проходят."
  - id: task-4666
    title: "Диагностика: проверить работоспособность бота"
    description:
      "Пользователь спрашивает, всё ли работает в проекте. Нужно провести
      диагностику без изменения файлов проекта: проверить текущее состояние
      реализации (typecheck, lint, build), состояние dev-сервера через docker
      compose ps, доступность эндпоинта здоровья, применённость миграций
      DynamoDB, а также убедиться, что все задачи из плана выполнены и ключевые
      модули (Telegram webhook/обработчик, движок копирования, клиент UpScale,
